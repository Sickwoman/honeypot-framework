# =============================================================================
# Logstash pipeline for the PQC SSH honeypot variants.
# Mirrors the conventions in the repo's top-level logstash.conf:
#   - file input + json codec
#   - adds honeypot_type / service / event_type
#   - writes to the shared honeypot-YYYY.MM.dd index in Elasticsearch
# Mount the pqc-logs volume at /var/log/pqc-honeypot (see docker-compose.yml).
# =============================================================================

input {
  file {
    path => "/var/log/pqc-honeypot/events.json"
    start_position => "beginning"
    codec => json
    tags => ["pqc", "honeypot"]
  }
}

filter {
  if "pqc" in [tags] {
    mutate {
      add_field => { "honeypot_type" => "pqc_ssh" }
      add_field => { "service" => "SSH" }
    }

    # Normalise our event names onto the same event_type field the rest of the
    # framework uses.
    if [event] == "kex_negotiated" {
      mutate { add_field => { "event_type" => "key_exchange" } }
    }
    if [event] == "honeypot_start" {
      mutate { add_field => { "event_type" => "service_start" } }
    }
    # Hand-off events (see handoff/): align onto the framework's vocabulary so
    # PQC-relay credential captures sit alongside the other honeypots' logins.
    if [event] == "cred_attempt" {
      mutate { add_field => { "event_type" => "login_attempt" } }
    }
    if [event] == "handoff" {
      mutate { add_field => { "event_type" => "session_handoff" } }
    }

    # post_quantum arrives as a JSON boolean; keep it boolean for clean Kibana
    # aggregations (true/false split of attacker PQC support).
  }

  mutate {
    add_field => { "[@metadata][index_name]" => "honeypot-%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
  }
  stdout { codec => rubydebug }
}
