# Logstash Secure Pipeline Configuration
# Processes honeypot logs with SSL/TLS encryption to Elasticsearch

input {
  # Cowrie SSH Honeypot Logs
  file {
    path => "/home/cowrie/cowrie/var/log/cowrie/cowrie.log"
    type => "cowrie"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/.sincedb_cowrie"
    tags => ["cowrie", "ssh", "honeypot"]
  }
  
  # OpenCanary Multi-Service Logs
  file {
    path => "/var/tmp/opencanary.log"
    type => "opencanary"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/.sincedb_opencanary"
    tags => ["opencanary", "multi-service", "honeypot"]
  }

  # Syslog for system events (optional)
  udp {
    port => 5514
    type => "syslog"
    tags => ["system", "honeypot"]
  }
}

filter {
  # Parse Cowrie logs
  if [type] == "cowrie" {
    # Extract key fields
    mutate {
      add_field => {
        "honeypot_type" => "cowrie"
        "service" => "ssh"
        "port" => 2222
      }
    }
    
    # Rename fields for consistency
    mutate {
      rename => {
        "srcIP" => "src_ip"
        "srcPort" => "src_port"
        "username" => "username"
        "password" => "password"
        "command" => "command_executed"
      }
    }
  }

  # Parse OpenCanary logs
  if [type] == "opencanary" {
    mutate {
      add_field => {
        "honeypot_type" => "opencanary"
      }
    }
    
    # Rename fields
    mutate {
      rename => {
        "logdata" => "event_data"
        "canary.node_id" => "node_id"
      }
    }
    
    # Extract service and port from OpenCanary event
    if [event_data][USERNAME] {
      mutate {
        add_field => { "login_attempt" => true }
      }
    }
  }

  # GeoIP enrichment - Resolve source IP location
  geoip {
    source => "src_ip"
    target => "geoip"
    database => "/etc/logstash/geoip/GeoLite2-City.mmdb"
    tag_on_failure => ["geoip_lookup_failure"]
  }

  # Threat Intelligence Enrichment
  # This plugin requires external threat intel integration
  # Placeholder for future enhancement
  if [src_ip] {
    mutate {
      add_field => {
        "threat_level" => "unknown"
        "threat_indicators" => []
      }
    }
  }

  # Timestamp normalization
  date {
    match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "ISO8601"]
    target => "@timestamp"
  }

  # Sanitize sensitive data before indexing
  if [password] {
    mutate {
      replace => { "password" => "[REDACTED]" }
    }
  }

  # Add metadata
  mutate {
    add_field => {
      "honeypot_framework_version" => "2.0"
      "processing_timestamp" => "%{@timestamp}"
      "source" => "logstash"
    }
  }

  # Add severity levels
  if [type] == "cowrie" {
    if [command_executed] {
      mutate {
        add_field => { "severity" => "medium" }
      }
    } else if [username] and [password] {
      mutate {
        add_field => { "severity" => "high" }
      }
    } else {
      mutate {
        add_field => { "severity" => "low" }
      }
    }
  }

  # Performance optimization: Remove unnecessary fields
  mutate {
    remove_field => ["host", "path"]
  }
}

output {
  # Send to Elasticsearch with SSL/TLS
  elasticsearch {
    hosts => ["https://localhost:9200"]
    
    # Authentication
    user => "logstash_system"
    password => "${LOGSTASH_ES_PASSWORD}"
    
    # SSL/TLS Configuration
    ssl => true
    ssl_certificate_verification => true
    cacert => "/etc/honeypot-framework/ssl/ca-cert.pem"
    
    # Index naming
    index => "honeypot-%{+YYYY.MM.dd}"
    document_type => "_doc"
    
    # Performance tuning
    bulk_size => 500
    flush_interval => 5
    
    # Retry policy
    retry_on_conflict => 3
    retry_forever => false
    max_retries => 3
    
    # Keep-alive settings
    http_compression => true
    manage_template => true
    template_name => "honeypot"
    template_overwrite => false
  }

  # Also send to file for backup
  file {
    path => "/var/log/honeypot/honeypot-backup-%{+YYYY.MM.dd}.log"
    codec => json
    message_format => "%{[@timestamp]} %{message}"
  }

  # Send critical alerts immediately (optional)
  if [severity] == "high" or [severity] == "critical" {
    # This would connect to alert service
    # http {
    #   url => "https://api.honeypot.local:8443/api/alerts"
    #   http_method => "post"
    #   format => "message"
    #   message => "%{message}"
    # }
    
    # For now, just log to stdout (remove in production)
    # stdout {
    #   codec => rubydebug
    # }
  }
}
