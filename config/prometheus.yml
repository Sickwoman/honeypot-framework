global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'honeypot-framework'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['localhost:9200']
    basic_auth:
      username: 'elastic'
      # Password lives in a file readable only by the Prometheus user --
      # never inline a credential here.
      password_file: /etc/honeypot-framework/secrets/elastic-password
    scheme: https
    tls_config:
      ca_file: /etc/honeypot-framework/ssl/ca-cert.pem
    metrics_path: '/_prometheus/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'honeypot-metrics'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 10s

  - job_name: 'deception-sentinel'
    static_configs:
      - targets: ['localhost:8010']
    scrape_interval: 30s

