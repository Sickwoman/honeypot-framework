# Elasticsearch Security Configuration for Honeypot Framework
# Enhanced security with X-Pack, SSL/TLS, and audit logging

################################################################################
# BASIC SECURITY
################################################################################

# Enable X-Pack Security - REQUIRED for production
xpack.security.enabled: true

# Enable API key authentication
xpack.security.authc.api_key.enabled: true
xpack.security.authc.api_key.cache.ttl: 24h
xpack.security.authc.api_key.cache.max_tokens: 100000

################################################################################
# HTTP SECURITY (Client Connections)
################################################################################

# Enable HTTPS for HTTP traffic
xpack.security.http.ssl.enabled: true

# Certificate configuration (using PEM format)
xpack.security.http.ssl.key: "/etc/honeypot-framework/ssl/elasticsearch-key.pem"
xpack.security.http.ssl.certificate: "/etc/honeypot-framework/ssl/elasticsearch-cert.pem"
xpack.security.http.ssl.certificate_authorities: ["/etc/honeypot-framework/ssl/ca-cert.pem"]

# Require valid certificates
xpack.security.http.ssl.verification_mode: certificate

# TLS version control (disable older versions)
xpack.security.http.ssl.supported_protocols: ["TLSv1.2", "TLSv1.3"]
xpack.security.http.ssl.ciphers: [
  "TLS_AES_256_GCM_SHA384",
  "TLS_CHACHA20_POLY1305_SHA256",
  "TLS_AES_128_GCM_SHA256",
  "ECDHE-RSA-AES256-GCM-SHA384",
  "ECDHE-RSA-AES128-GCM-SHA256"
]

################################################################################
# NODE-TO-NODE SECURITY (Cluster Communication)
################################################################################

# Enable SSL/TLS for inter-node communication
xpack.security.transport.ssl.enabled: true

# Certificate configuration
xpack.security.transport.ssl.key: "/etc/honeypot-framework/ssl/elasticsearch-key.pem"
xpack.security.transport.ssl.certificate: "/etc/honeypot-framework/ssl/elasticsearch-cert.pem"
xpack.security.transport.ssl.certificate_authorities: ["/etc/honeypot-framework/ssl/ca-cert.pem"]

# Require valid node certificates
xpack.security.transport.ssl.verification_mode: certificate

# TLS version control
xpack.security.transport.ssl.supported_protocols: ["TLSv1.2", "TLSv1.3"]

################################################################################
# AUTHENTICATION & SESSION MANAGEMENT
################################################################################

# Built-in realm configuration
xpack.security.authc.realms.file.file1:
  order: 0

# Native user management
xpack.security.authc.realms.native.native1:
  order: 1

# Session timeout (15 minutes)
xpack.security.session.idleTimeout: 15m
xpack.security.session.sessionTimeout: 1d

# Token expiration (24 hours)
xpack.security.authc.token.timeout: 24h

################################################################################
# AUDIT LOGGING
################################################################################

# Enable comprehensive audit logging
xpack.security.audit.enabled: true

# Log to file and indices
xpack.security.audit.logfile.enabled: true
xpack.security.audit.logfile.level: info

# Log file location and size
xpack.security.audit.logfile.events.emit_request_body: false
xpack.security.audit.logfile.events.emit_request_headers: true

# Events to log
xpack.security.audit.logfile.events.include:
  # Authentication events
  - authentication_success
  - authentication_failure
  - access_token_created
  - access_token_expired
  - api_key_created
  - api_key_deleted
  
  # Authorization events
  - authorization_success
  - unauthorized_access
  - access_granted
  - access_denied
  
  # Privilege escalation
  - privilege_change
  - role_creation
  - role_deletion
  - role_update
  - user_creation
  - user_deletion
  - user_update
  
  # Sensitive operations
  - index_creation
  - index_deletion
  - security_config_change
  - database_integrity_failure

# Events to exclude
xpack.security.audit.logfile.events.exclude:
  - sql_query

# Exclude system indices from audit
xpack.security.audit.logfile.events.ignore_filters.default_filter:
  users: ["_system"]

################################################################################
# API KEY SETTINGS
################################################################################

# API Key rotation and expiration
xpack.security.authc.api_key.store.cache.ttl: "24h"

# Require API keys for programmatic access
xpack.security.authc.api_key.metadata.serializer: "json"

################################################################################
# ELASTICSEARCH SECURITY POLICIES
################################################################################

# Disable anonymous access
xpack.security.authc.anonymous.roles: ""
xpack.security.authc.anonymous.username: ""

# Require username/password or API key
xpack.security.http.ssl.client_authentication: optional

################################################################################
# CROSS-ORIGIN RESOURCE SHARING (CORS)
################################################################################

# Allow Kibana and API to communicate
http.cors.enabled: true
http.cors.allow-origin: ["https://localhost:5601", "https://127.0.0.1:5601"]
http.cors.allow-credentials: true
http.cors.allow-headers: ["Content-Type", "Authorization", "X-API-Key"]

################################################################################
# BUILT-IN USERS
################################################################################

# Default user credentials (MUST BE CHANGED!)
# 
# Username: elastic
# Password: changeme  <-- CHANGE THIS IMMEDIATELY!
#
# To change built-in user passwords:
